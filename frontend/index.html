<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Shopping Lists</h1>

        <button id="createListButton" class="createButton">Create New List</button>
        <button id="createArticleButton" class="secondary-button">Create New Article</button>

        <p id="feedback" class="feedback" aria-live="polite"></p>

        <div id="layout" class="layout">
            <section class="panel">
                <h2>Available Lists</h2>
                <div id="lists" class="list-stack"></div>
            </section>

            <section class="panel">
                <h2 id="detailTitle">Select a list</h2>


                <div id="items" class="list-stack"></div>
            </section>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
