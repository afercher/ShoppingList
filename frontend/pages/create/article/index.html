<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Article</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <div class="container">
        <h1>Create New Article</h1>

        <div id="feedback" class="feedback"></div>

        <form id="articleForm" class="form">
            <div class="form-group">
                <label for="articleName">Article Name</label>
                <input
                    id="articleName"
                    type="text"
                    placeholder="e.g. Tomatoes, Milk, Bread"
                    required
                >
            </div>

            <div class="form-group">
                <label for="departmentSelect">Department</label>
                <div style="display: flex; gap: 8px;">
                    <select id="departmentSelect" required style="flex: 1;"></select>
                    <button id="addDepartmentButton" class="secondary-button" type="button">Add New Department</button>
                </div>
            </div>

            <div id="addDepartmentForm" class="form-group hidden">
                <label for="newDepartmentName">New Department Name</label>
                <input
                    id="newDepartmentName"
                    type="text"
                    placeholder="e.g. Frozen Food, Health & Beauty"
                >
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <button id="submitDepartmentButton" class="createButton" type="button" style="flex: 1;">Create</button>
                    <button id="cancelDepartmentButton" class="secondary-button" type="button" style="flex: 1;">Cancel</button>
                </div>
            </div>

            <div class="button-row">
                <button id="submitArticleButton" class="createButton" type="button">Create Article</button>
                <button id="backButton" class="secondary-button" type="button">Back</button>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
