<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
<div id="container">
    <h1 id="listTitle">Shopping</h1>

    <p id="feedback" class="feedback" aria-live="polite"></p>

    <div id="items" class="list-stack"></div>

    <div style="display: flex; gap: 8px; margin-top: 24px;">
        <button id="finishButton" class="createButton" type="button" style="flex: 1;">Finish Shopping</button>
        <button id="backButton" class="secondary-button" type="button" style="flex: 1;">Back</button>
    </div>

    <script src="app.js"></script>
</div>
</body>
</html>
